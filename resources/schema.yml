resources:
  schemas:
    wikipedia:
      name: wikipedia
      catalog_name: ${var.catalog}
      comment: Wikipedia hourly pageviews lakehouse (bronze / silver / gold). Managed by Databricks Asset Bundles.
      # Granted on the schema rather than per table, so the app can deploy before its table exists.
      grants:
        - principal: ${resources.apps.digest_app.service_principal_client_id}
          privileges: [USE_SCHEMA, SELECT]

  volumes:
    raw:
      name: raw
      catalog_name: ${var.catalog}
      schema_name: ${resources.schemas.wikipedia.name}
      volume_type: MANAGED
      comment: Landing zone for raw hourly pageview dumps (.gz) and the wiki site list CSV.
